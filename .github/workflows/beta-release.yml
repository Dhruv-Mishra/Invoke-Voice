name: Beta release
run-name: Beta release (${{ inputs.bump }}) ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - prepatch
          - preminor
      request_id:
        description: Dispatch correlation ID
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install dependencies
        run: npm ci

      - name: Set beta version
        id: version
        shell: pwsh
        run: |
          npm version '${{ inputs.bump }}' --preid=beta --no-git-tag-version
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: npm test

      - name: Test voice pack format
        run: python -I test/voice_pack_test.py

      - name: Build Windows installers
        run: npm run dist:win

      - name: Verify release assets
        id: asset
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $pack = Get-Content artifacts/voice-pack/descriptor.json -Raw | ConvertFrom-Json
          $assets = @("release/Voice Work Supervisor-Setup-$version.exe", "release/Voice Work Supervisor-Setup-$version-Online.exe", "release/$($pack.filename)")
          if ((Get-FileHash $assets[2] -Algorithm SHA256).Hash.ToLower() -ne $pack.sha256) { throw 'Dependency pack checksum mismatch.' }
          foreach ($asset in $assets) {
            $filename = Split-Path $asset -Leaf
            $checksum = "$((Get-FileHash $asset -Algorithm SHA256).Hash.ToLower())  $filename"
            Set-Content -Path "$asset.sha256" -Value $checksum -Encoding ascii
          }

      - name: Commit and tag version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore: release $env:TAG"
          git tag -a $env:TAG -m "Voice Work Supervisor $env:VERSION beta"
          git push --atomic origin "HEAD:${{ github.ref_name }}" "refs/tags/$env:TAG"

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $pack = Get-Content artifacts/voice-pack/descriptor.json -Raw | ConvertFrom-Json
          $assets = @("release/Voice Work Supervisor-Setup-$env:VERSION.exe", "release/Voice Work Supervisor-Setup-$env:VERSION-Online.exe", "release/$($pack.filename)")
          $upload = @($assets | ForEach-Object { $_; "$_.sha256" })
          gh release create $env:TAG @upload --repo '${{ github.repository }}' --title "Voice Work Supervisor $env:VERSION" --generate-notes --prerelease --latest=false